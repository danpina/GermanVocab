services:
  - type: web
    name: german-vocab-helper
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DEEPL_API_URL
        value: https://api-free.deepl.com/v2/translate
      - key: DEEPL_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: JWT_SECRET
        sync: false
      # Sign in with Apple (see .env.example). The last three are only needed to revoke
      # Apple tokens when an account is deleted.
      - key: APPLE_BUNDLE_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
