name: GermanVocabHelper
options:
  bundleIdPrefix: com.danipina
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
targets:
  GermanVocabHelper:
    type: application
    platform: iOS
    sources:
      - GermanVocabHelper
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: Linguanest
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Linguanest uses the microphone only while you tap Dictate on the Today screen, so you can say a word or phrase, for example “Guten Morgen”, instead of typing it. The audio is not recorded or saved."
        NSSpeechRecognitionUsageDescription: "Linguanest uses speech recognition to turn what you say after tapping Dictate into text. For example, saying “Guten Morgen” fills the text box with that phrase so you can translate and save it. Your speech is processed by Apple and is not stored by Linguanest."
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: Generated/GermanVocabHelper.entitlements
      properties:
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danipina.germanvocabhelper
        DEVELOPMENT_TEAM: RW46NLF44W
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "5"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
