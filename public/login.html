<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Linguanest</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="auth-main">
    <h1>Linguanest</h1>
    <p class="subtitle">Log in to see your saved words.</p>

    <form id="loginForm" class="lookup auth-form">
      <label for="email">Email or user ID</label>
      <input type="text" id="email" name="email" autocomplete="username" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />

      <button id="loginBtn" type="submit">Log in</button>
      <p id="wakeHint" class="muted hidden">Waking up the server… this can take up to a minute the first time.</p>
      <p id="error" class="error hidden"></p>
    </form>

    <p class="subtitle"><a href="register.html">Need an account? Sign up</a></p>
    <p class="muted"><a href="privacy.html">Privacy Policy</a> · <a href="support.html">Support</a></p>
  </main>

  <script src="login.js"></script>
</body>
</html>
