<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign up — Linguanest</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="auth-main">
    <h1>Linguanest</h1>
    <p class="subtitle">Create an account to start saving words.</p>

    <form id="registerForm" class="lookup auth-form">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="username" required />

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required />
      <p class="muted">At least 8 characters.</p>

      <button id="registerBtn" type="submit">Create account</button>
      <p id="error" class="error hidden"></p>
    </form>

    <p class="subtitle"><a href="login.html">Already have an account? Log in</a></p>
    <p class="muted">By creating an account you agree to our <a href="privacy.html">Privacy Policy</a>.</p>
  </main>

  <script src="register.js"></script>
</body>
</html>
