<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings — Linguanest</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <nav class="top-nav">
      <h1>Settings</h1>
      <div class="nav-links">
        <a href="index.html">← Back to today</a>
        <span id="userBar" class="user-bar"></span>
      </div>
    </nav>
    <p class="subtitle">Choose which language you're learning, which one you want translations in, and how Games plays.</p>

    <form id="settingsForm" class="lookup auth-form">
      <label for="inputLang">I'm learning</label>
      <select id="inputLang" name="inputLang"></select>

      <label for="outputLang">Translate into</label>
      <select id="outputLang" name="outputLang"></select>

      <label for="wordsPerGame">Words per game (3–20)</label>
      <input type="number" id="wordsPerGame" name="wordsPerGame" min="3" max="20" required />

      <button id="saveBtn" type="submit">Save</button>
      <p id="error" class="error hidden"></p>
      <p id="saved" class="empty hidden">Saved.</p>
    </form>

    <section class="lookup">
      <h2>Delete account</h2>
      <p class="muted">Permanently deletes your account, saved words, and stats. This can't be undone.</p>
      <button id="deleteAccountBtn" type="button">Delete my account</button>
      <p id="deleteError" class="error hidden"></p>
    </section>
  </main>

  <script src="languages.js"></script>
  <script src="common.js"></script>
  <script src="settings.js"></script>
</body>
</html>
