name: iOS build check

# Compiles the app on a real Mac in GitHub's cloud whenever iOS code changes, so
# Swift errors show up right after a push instead of during a TestFlight upload.
# No signing or secrets involved. Free for public repositories.
on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build-check.yml'
  pull_request:
    paths:
      - 'ios/**'
  workflow_dispatch:

concurrency:
  group: ios-build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: ios
        run: xcodegen generate

      # Debug build for the simulator: the same configuration you run from Xcode.
      - name: Build (Debug, simulator)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project GermanVocabHelper.xcodeproj -scheme GermanVocabHelper \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-debug.log | tail -n 30

      # Release build for a device: this is what ships, and it compiles the code paths
      # that #if DEBUG hides from the Debug build.
      - name: Build (Release, device)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build \
            -project GermanVocabHelper.xcodeproj -scheme GermanVocabHelper \
            -configuration Release -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee build-release.log | tail -n 30

      # Surfaces compiler errors as annotations on the run so they're easy to find.
      - name: Report compiler errors
        if: failure()
        working-directory: ios
        run: |
          for log in build-debug.log build-release.log; do
            [ -f "$log" ] && grep -E "error:" "$log" | sort -u | head -n 20 | while read -r line; do
              echo "::error::$line"
            done
          done
